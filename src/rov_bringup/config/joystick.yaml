teleop_twist_joy_node:
  ros__parameters:
    axis_linear.x: 1       # lewy drążek pion -> surge (X)
    axis_linear.y: 0       # lewy drążek poziom -> sway (Y)
    scale_linear.x: 1.0
    scale_linear.y: 1.0
    enable_button: 4       # np. lewy bumper, przełącznik typu "martwy człowiek"
    require_enable_button: true
