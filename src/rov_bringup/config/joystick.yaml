teleop_twist_joy_node:
  ros__parameters:
    axis_linear.x: 1       # left stick vertical -> surge (X)
    axis_linear.y: 0       # left stick horizontal -> sway (Y)
    scale_linear.x: 1.0
    scale_linear.y: 1.0
    enable_button: 4       # e.g. left bumper, "dead man's switch"
    require_enable_button: true
