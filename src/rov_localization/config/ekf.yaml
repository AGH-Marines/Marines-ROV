ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: false # Robot porusza się w pełnym 3D (Z, Pitch, Roll są aktywne)
    publish_tf: true  # Węzeł będzie automatycznie publikował transformację odom -> base_link

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. Odometria kinematyczna ze Stonefisha
    odom0: /marines_rov/odometry
    odom0_config: [true,  true,  true,   # X, Y, Z
                   false, false, false,  # Roll, Pitch, Yaw (bierzemy z IMU)
                   true,  true,  true,   # dX, dY, dZ (Prędkości liniowe)
                   false, false, false,  # dRoll, dPitch, dYaw
                   false, false, false]  # Akceleracje

    # 2. Filtr IMU
    imu0: /marines_rov/imu
    imu0_config: [false, false, false,  # X, Y, Z
                  true,  true,  true,   # Roll, Pitch, Yaw
                  false, false, false,  # dX, dY, dZ
                  true,  true,  true,   # dRoll, dPitch, dYaw (Prędkości kątowe)
                  false,  false,  false]   # Akceleracje liniowe

    imu0_remove_gravitational_acceleration: true

    # 3. Doppler Velocity Log (DVL) - prędkości liniowe względem dna
    twist0: /marines_rov/dvl
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  true,   # dX, dY, dZ z czujnika akustycznego
                    false, false, false,
                    false, false, false]