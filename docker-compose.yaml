version: '3.8'

services:
  rov-ros2-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USERNAME: dev
        UID: 1000
        GID: 1000
    image: rov_ros2_dev_image
    container_name: pycharm_rov_ros2
    user: dev
    working_dir: /home/dev/ros2_ws

    command: sleep infinity

    privileged: true
    network_mode: "host"

    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined

    device_cgroup_rules:
      - 'c *:* rmw'

    volumes:
      # Mount the workspace
      - .:/home/dev/ros2_ws:rw
      # Mount devices (for ROS2/ROV)
      - /dev:/dev:rw
      # GUI configuration (X11)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # - ~/.Xauthority:/home/dev/.Xauthority:rw # Uncomment if you run into GUI permission issues

    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/home/dev/.Xauthority
      - PYTHONPATH=src:install/lib/python3.10/site-packages:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages
      # NVIDIA environment variables
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    # GPU passthrough section (replaces --gpus all from runArgs)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]